name: CodeQL

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '34 5 * * 1'

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 2

jobs:
  analyze:
    name: Analyze C/C++
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache fetched dependencies
        uses: actions/cache@v4
        with:
          path: build/codeql-headless/_deps
          key: codeql-fetchcontent-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'cmake/**/*.cmake', '.github/workflows/*.yml') }}
          restore-keys: |
            codeql-fetchcontent-${{ runner.os }}-

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: c-cpp
          build-mode: manual

      - name: Configure
        run: >
          cmake -S . -B build/codeql-headless
          -DKARMA_FETCH_DEPS=ON
          -DKARMA_BUILD_EXAMPLES=OFF
          -DKARMA_BUILD_TESTS=ON
          -DBUILD_TESTING=ON
          -DKARMA_HEADLESS=ON
          -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build/codeql-headless --config Release --parallel 2

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:c-cpp'
