name: Full Build

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * *'
  pull_request:
    types: [opened, reopened, synchronize, labeled]

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 2
  CTEST_OUTPUT_ON_FAILURE: 1

jobs:
  gate:
    name: Decide full build
    runs-on: ubuntu-latest

    outputs:
      should_run: ${{ steps.decide.outputs.should_run }}
      reason: ${{ steps.decide.outputs.reason }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Decide whether to run
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HAS_FULL_BUILD_LABEL: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci/full-build') }}
        run: |
          set -euo pipefail

          current_version="$(tr -d '[:space:]' < VERSION)"

          if [[ "$GITHUB_EVENT_NAME" == "pull_request" && "$PR_HAS_FULL_BUILD_LABEL" != "true" ]]; then
            reason="pull request is not labeled ci/full-build"
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "reason=$reason" >> "$GITHUB_OUTPUT"
            echo "$reason"
            exit 0
          fi

          if [[ "$GITHUB_EVENT_NAME" != "schedule" ]]; then
            reason="$GITHUB_EVENT_NAME run requested full build for version $current_version"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "reason=$reason" >> "$GITHUB_OUTPUT"
            echo "$reason"
            exit 0
          fi

          last_sha="$(
            gh api --method GET "/repos/${GITHUB_REPOSITORY}/actions/workflows/full-build.yml/runs" \
              -F branch=main \
              -F status=success \
              -F per_page=1 \
              --jq '.workflow_runs[0].head_sha // ""'
          )"

          if [[ -z "$last_sha" ]]; then
            reason="no successful full build found on main; building version $current_version"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "reason=$reason" >> "$GITHUB_OUTPUT"
            echo "$reason"
            exit 0
          fi

          git fetch --depth=1 origin "$last_sha"
          last_version="$(git show "$last_sha:VERSION" | tr -d '[:space:]')"

          if [[ "$current_version" == "$last_version" ]]; then
            reason="latest successful full build already covered version $current_version"
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "reason=$reason" >> "$GITHUB_OUTPUT"
            echo "$reason"
            exit 0
          fi

          reason="nightly full build needed: version changed from $last_version to $current_version"
          echo "should_run=true" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          echo "$reason"

  build:
    needs: gate
    if: >-
      ${{
        needs.gate.outputs.should_run == 'true'
      }}
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux graphical dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache pkg-config xorg-dev libglu1-mesa-dev

      - name: Install macOS compiler cache
        if: runner.os == 'macOS'
        run: brew install ccache

      - name: Enable compiler cache
        if: runner.os != 'Windows'
        run: |
          echo "CCACHE_DIR=${{ github.workspace }}/.ccache" >> "$GITHUB_ENV"
          echo "CCACHE_MAXSIZE=2G" >> "$GITHUB_ENV"
          echo "CCACHE_COMPILERCHECK=content" >> "$GITHUB_ENV"
          echo "CCACHE_BASEDIR=${{ github.workspace }}" >> "$GITHUB_ENV"
          echo "CMAKE_C_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"
          echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"

      - name: Cache compiler outputs
        if: runner.os != 'Windows'
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ github.job }}-
            ccache-${{ runner.os }}-

      - name: Cache fetched dependencies
        uses: actions/cache@v4
        with:
          path: |
            build/ci-headless/_deps
            build/ci-graphical/_deps
            build/ci-minimal-headless/_deps
            build/consumer-install/_deps
            build/consumer-source/karma-build/_deps
            build/consumer-source-graphical/karma-build/_deps
          key: full-build-fetchcontent-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'cmake/**/*.cmake', '.github/workflows/*.yml') }}
          restore-keys: |
            full-build-fetchcontent-${{ runner.os }}-

      - name: Configure headless
        run: >
          cmake -S . -B build/ci-headless
          -DKARMA_FETCH_DEPS=ON
          -DKARMA_BUILD_EXAMPLES=ON
          -DKARMA_BUILD_TESTS=ON
          -DBUILD_TESTING=ON
          -DKARMA_HEADLESS=ON
          -DCMAKE_BUILD_TYPE=Release

      - name: Build headless
        run: cmake --build build/ci-headless --config Release --parallel 2

      - name: Test headless
        run: ctest --test-dir build/ci-headless --build-config Release --output-on-failure

      - name: Configure graphical
        run: >
          cmake -S . -B build/ci-graphical
          -DKARMA_FETCH_DEPS=ON
          -DKARMA_BUILD_EXAMPLES=ON
          -DKARMA_BUILD_TESTS=OFF
          -DBUILD_TESTING=OFF
          -DKARMA_BUILD_HEADLESS_PROFILE=OFF
          -DKARMA_BUILD_GRAPHICAL_PROFILE=ON
          -DCMAKE_BUILD_TYPE=Release

      - name: Build graphical
        run: cmake --build build/ci-graphical --config Release --parallel 2

      - name: Configure minimal headless install
        run: >
          cmake -S . -B build/ci-minimal-headless
          -DKARMA_FETCH_DEPS=ON
          -DKARMA_BUILD_EXAMPLES=OFF
          -DKARMA_BUILD_TESTS=OFF
          -DBUILD_TESTING=OFF
          -DKARMA_HEADLESS=ON
          -DKARMA_ENABLE_AUDIO=OFF
          -DKARMA_ENABLE_NAVIGATION=OFF
          -DKARMA_NETWORK_BACKEND_ENET=OFF
          -DKARMA_PHYSICS_BACKEND_JOLT=OFF
          -DKARMA_PHYSICS_BACKEND_BULLET=OFF
          -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/build/ci-install
          -DCMAKE_BUILD_TYPE=Release

      - name: Build minimal headless
        run: cmake --build build/ci-minimal-headless --config Release --parallel 2

      - name: Install minimal headless
        run: cmake --install build/ci-minimal-headless --config Release

      - name: Upload minimal headless package
        uses: actions/upload-artifact@v4
        with:
          name: karma-minimal-headless-${{ runner.os }}
          path: build/ci-install
          if-no-files-found: error

      - name: Configure installed-package consumer smoke
        run: >
          cmake -S tests/consumer/install -B build/consumer-install
          -DCMAKE_PREFIX_PATH=${{ github.workspace }}/build/ci-install
          -DKARMA_CONFIG_FETCH_DEPS=ON
          -DCMAKE_BUILD_TYPE=Release

      - name: Build installed-package consumer smoke
        run: cmake --build build/consumer-install --config Release --parallel 2

      - name: Test installed-package consumer smoke
        run: ctest --test-dir build/consumer-install --build-config Release --output-on-failure

      - name: Configure source-vendored consumer smoke
        run: >
          cmake -S tests/consumer/source -B build/consumer-source
          -DKARMA_SOURCE_DIR=${{ github.workspace }}
          -DCMAKE_BUILD_TYPE=Release

      - name: Build source-vendored consumer smoke
        run: cmake --build build/consumer-source --config Release --parallel 2

      - name: Test source-vendored consumer smoke
        run: ctest --test-dir build/consumer-source --build-config Release --output-on-failure

      - name: Configure source-vendored graphical consumer smoke
        run: >
          cmake -S tests/consumer/source-graphical -B build/consumer-source-graphical
          -DKARMA_SOURCE_DIR=${{ github.workspace }}
          -DCMAKE_BUILD_TYPE=Release

      - name: Build source-vendored graphical consumer smoke
        run: cmake --build build/consumer-source-graphical --config Release --parallel 2

      - name: Test source-vendored graphical consumer smoke
        run: ctest --test-dir build/consumer-source-graphical --build-config Release --output-on-failure
