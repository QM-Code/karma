<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Karma Engine logo</title>
  <desc id="desc">A stylized K monogram with orbiting engine paths.</desc>
  <defs>
    <linearGradient id="bg" x1="72" y1="64" x2="448" y2="448" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#182336"/>
      <stop offset="0.48" stop-color="#20384d"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="beam" x1="120" y1="386" x2="392" y2="118" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4dd4ac"/>
      <stop offset="0.48" stop-color="#f2c94c"/>
      <stop offset="1" stop-color="#f06d5f"/>
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.30 0 0 0 0 0.83 0 0 0 0 0.68 0 0 0 0.70 0" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect x="38" y="38" width="436" height="436" rx="82" fill="url(#bg)"/>
  <path d="M132 340c78 58 176 57 246-2" fill="none" stroke="#4dd4ac" stroke-width="16" stroke-linecap="round" opacity="0.58"/>
  <path d="M126 182c82-62 184-61 260 8" fill="none" stroke="#f06d5f" stroke-width="16" stroke-linecap="round" opacity="0.52"/>
  <path d="M168 142v228" fill="none" stroke="#f8fafc" stroke-width="44" stroke-linecap="round"/>
  <path d="M352 142 196 256l160 114" fill="none" stroke="url(#beam)" stroke-width="50" stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlow)"/>
  <circle cx="378" cy="182" r="17" fill="#f2c94c"/>
  <circle cx="124" cy="332" r="15" fill="#4dd4ac"/>
  <circle cx="354" cy="348" r="12" fill="#f06d5f"/>
</svg>
